<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141e2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>손안의 도시</title>
<style>
  :root {
    --bg: #141e2a;
    --panel: #1b2838;
    --panel2: #243447;
    --ink: #eef3f7;
    --muted: #9fb0c0;
    --accent: #ffb84d;
    --r: #5fcf6a;
    --c: #5aa9ff;
    --i: #f2c94c;
    --danger: #ff6b6b;
    --ok: #5fcf6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
    font-size: 14px;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- top bar ---------- */
  #top {
    display: flex; align-items: center; gap: 4px; padding: 6px 6px;
    padding-top: calc(6px + env(safe-area-inset-top));
    background: var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,.35); z-index: 5; flex: 0 0 auto;
  }
  .stat { display: flex; align-items: baseline; gap: 2px; font-size: 12px; white-space: nowrap; }
  .stat b { font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat small { font-size: 10px; color: var(--muted); }
  .stat small.pos { color: var(--ok); } .stat small.neg { color: var(--danger); }
  #hDate { color: var(--muted); font-size: 11px; margin-left: auto; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; white-space: nowrap; }
  .rci { display: flex; gap: 2px; align-items: flex-end; height: 22px; padding: 0 1px; }
  .rci i { display: block; width: 6px; height: 22px; background: #0e151e; border-radius: 2px; position: relative; overflow: hidden; }
  .rci i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 50%; height: var(--h, 0%); background: var(--col); transition: height .4s; }
  .rci i.neg::after { bottom: auto; top: 50%; background: var(--danger); }
  .rci i::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,.25); z-index: 1; }
  .ib { width: 28px; height: 28px; border-radius: 8px; background: var(--panel2); font-size: 15px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .ib:active { background: #30465f; }
  @media (max-width: 350px) { #hDate { display: none; } .stat small { display: none; } }
  .ib.on { background: var(--accent); color: #1b1b1b; }
  #spd { font-size: 10px; font-weight: 800; letter-spacing: -1px; width: 34px; }

  /* ---------- map ---------- */
  #mapwrap { flex: 1 1 auto; position: relative; min-height: 0; background: #0e1820; }
  canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #toasts { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 6; pointer-events: none; width: 92%; }
  .toast {
    background: rgba(20,30,42,.92); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35); animation: pop .25s ease-out; pointer-events: auto; max-width: 100%; text-align: center;
  }
  .toast.warn { background: rgba(170,50,40,.95); }
  .toast.good { background: rgba(40,120,70,.95); }
  @keyframes pop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  #paintLabel { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(20,30,42,.9); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; pointer-events: none; display: none; z-index: 3; white-space: nowrap; }
  #paintLabel.bad { color: var(--danger); }
  #hint { position: absolute; left: 8px; right: 8px; bottom: 8px; text-align: center; font-size: 11px; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px #000; pointer-events: none; }
  #zoomBtns { position: absolute; right: 8px; bottom: 28px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
  #zoomBtns button { width: 34px; height: 34px; border-radius: 10px; background: rgba(20,30,42,.85); font-size: 20px; font-weight: 700; }
  #pausePill { position: absolute; left: 8px; top: 8px; background: rgba(20,30,42,.85); padding: 5px 10px; border-radius: 999px; font-size: 12px; display: none; z-index: 3; }

  /* quest card */
  #quest { position: absolute; left: 8px; right: 54px; top: 8px; background: rgba(27,40,56,.94); border-radius: 12px; padding: 8px 10px; font-size: 12px; z-index: 3; box-shadow: 0 4px 14px rgba(0,0,0,.3); border-left: 3px solid var(--accent); }
  #quest.min { right: auto; padding: 6px 10px; }
  #quest.min .qbody { display: none; }
  #quest .qh { display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
  #quest .qh span { color: var(--accent); }
  #quest .qbody { margin-top: 4px; color: var(--muted); line-height: 1.45; }
  #quest .qbody b { color: var(--ink); }
  #quest .prog { display: flex; gap: 3px; margin-top: 6px; }
  #quest .prog i { flex: 1; height: 4px; border-radius: 2px; background: #0e151e; }
  #quest .prog i.d { background: var(--ok); }

  /* info sheet */
  .sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(27,40,56,.97); border-radius: 14px; padding: 12px; z-index: 4; box-shadow: 0 6px 20px rgba(0,0,0,.4); font-size: 13px; }
  .sheet.hidden { display: none; }
  .sheet h3 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .sheet .row { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); margin: 3px 0; }
  .sheet .row b { color: var(--ink); font-weight: 600; }
  .sheet .btns { display: flex; gap: 8px; margin-top: 8px; }
  .btn { background: var(--panel2); padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 13px; }
  .btn.danger { background: #7a2e2e; }
  .btn.primary { background: var(--accent); color: #1b1b1b; }
  .btn:active { transform: translateY(1px); }
  .ok { color: var(--ok); } .bad { color: var(--danger); }

  /* ---------- toolbar ---------- */
  #toolbar {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; flex: 0 0 auto;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: var(--panel); scrollbar-width: none; z-index: 5; box-shadow: 0 -2px 8px rgba(0,0,0,.35);
  }
  #toolbar::-webkit-scrollbar { display: none; }
  .tool {
    flex: 0 0 auto; width: 60px; height: 62px; border-radius: 12px; background: var(--panel2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 11px; color: var(--muted); border: 2px solid transparent;
  }
  .tool .ic { font-size: 21px; line-height: 1.1; }
  .tool .cost { font-size: 10px; color: #ffd18a; }
  .tool.on { border-color: var(--accent); background: #2f4661; color: #fff; }
  .tool.sep { width: 2px; background: rgba(255,255,255,.08); border-radius: 1px; margin: 10px 2px; height: 42px; align-self: center; }

  /* ---------- modal ---------- */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #modal.hidden { display: none; }
  .box { background: var(--panel); border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; max-height: calc(100% - 32px); overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .box h2 { margin: 0 0 10px; font-size: 18px; }
  .box h4 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .box p { margin: 6px 0; line-height: 1.55; font-size: 13px; }
  .box table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .box td { padding: 4px 0; } .box td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .box tr.total td { border-top: 1px solid rgba(255,255,255,.15); font-weight: 800; }
  .box .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .box .btns .btn { flex: 1; text-align: center; }
  .bar { height: 8px; background: #0e151e; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--col, var(--accent)); }
  .dem { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
  .dem .lab { width: 34px; font-weight: 800; }
  .dem .track { flex: 1; height: 10px; background: #0e151e; border-radius: 5px; position: relative; }
  .dem .track i { position: absolute; top: 0; bottom: 0; left: 50%; background: var(--col); border-radius: 5px; }
  .dem .track i.neg { background: var(--danger); }
  input[type=range] { width: 100%; }
  .menu .btn { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 12px 14px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
  .kv div span { color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="stat"><span>💰</span><b id="hMoney">0</b><small id="hDelta"></small></div>
    <div class="stat"><span>👥</span><b id="hPop">0</b></div>
    <div id="hDate">2026.1</div>
    <div class="rci" title="수요 R·C·I"><i id="dR" style="--col:var(--r)"></i><i id="dC" style="--col:var(--c)"></i><i id="dI" style="--col:var(--i)"></i></div>
    <button class="ib" id="btnPause" title="일시정지">⏸</button>
    <button class="ib" id="spd" title="속도">▶</button>
    <button class="ib" id="btnStats" title="통계">📊</button>
    <button class="ib" id="btnMenu" title="메뉴">☰</button>
  </header>

  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="pausePill">⏸ 일시정지</div>
    <div id="quest">
      <div class="qh"><span id="qTitle">목표</span><button id="qToggle" style="font-size:12px;color:var(--muted)">접기 ▲</button></div>
      <div class="qbody"><b id="qText"></b><div id="qHint"></div><div class="prog" id="qProg"></div></div>
    </div>
    <div id="toasts"></div>
    <div id="paintLabel"></div>
    <div id="zoomBtns"><button id="zin">+</button><button id="zout">−</button></div>
    <div id="hint"></div>
    <div id="info" class="sheet hidden"></div>
  </div>

  <nav id="toolbar"></nav>
  <div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
</div>

<script>
(() => {
'use strict';
const W = 40, H = 40, T = 32, N = W * H;
const ZMIN = 0.35, ZMAX = 3;
const SAVE_KEY = 'city-save-v1';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const idx = (x, y) => y * W + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const fmtS = n => { const a = Math.abs(n); return a >= 100000 ? (n < 0 ? '-' : '') + (a / 10000).toFixed(a >= 1000000 ? 0 : 1) + '만' : fmt(n); }; // compact for the top bar
const cv = $('map'), cx = cv.getContext('2d');
const wrap = $('mapwrap');
let cw = 0, ch = 0, dpr = 1, cvRect = { left: 0, top: 0 };

// ---------- RNG / hash ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hsh(x, y, s = 0) { let h = (Math.imul(x + 1, 73856093) ^ Math.imul(y + 1, 19349663) ^ Math.imul(s + 1, 83492791)) >>> 0; h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995) >>> 0; h ^= h >>> 15; return h >>> 0; }
const h01 = (x, y, s = 0) => hsh(x, y, s) / 4294967296;

// ---------- definitions ----------
const ZONE = {
  R: { name: '주거지역', color: '#5fcf6a', pop: [0, 8, 24, 60], lvl: ['빈 터', '단독주택', '연립주택', '아파트'] },
  C: { name: '상업지역', color: '#5aa9ff', jobs: [0, 6, 18, 45], lvl: ['빈 터', '상점', '상가 건물', '오피스 타워'] },
  I: { name: '공업지역', color: '#f2c94c', jobs: [0, 10, 30, 70], lvl: ['빈 터', '작업장', '공장', '대형 공단'] },
};
const BLD = {
  park:     { name: '공원',   size: 1, upkeep: 3,  radius: 4,  ic: '🌳', power: 0 },
  power:    { name: '발전소', size: 2, upkeep: 60, supply: 200, ic: '⚡', power: 0 },
  water:    { name: '급수탑', size: 1, upkeep: 15, radius: 8,  ic: '💧', power: 2 },
  police:   { name: '경찰서', size: 1, upkeep: 30, radius: 9,  ic: '🚓', power: 3 },
  fire:     { name: '소방서', size: 1, upkeep: 30, radius: 9,  ic: '🚒', power: 3 },
  school:   { name: '학교',   size: 2, upkeep: 45, radius: 11, ic: '🏫', power: 4 },
  hospital: { name: '병원',   size: 2, upkeep: 60, radius: 11, ic: '🏥', power: 4 },
  rubble:   { name: '잔해',   size: 1, upkeep: 0,  ic: '🧱', power: 0 },
};
const ZONE_POWER = [0, 1, 2, 4];
const TOOLS = [
  { id: 'hand', ic: '👆', name: '정보', cost: 0, hint: '끌어서 이동 · 두 손가락으로 확대 · 탭하면 정보' },
  { id: 'road', ic: '🛣️', name: '도로', cost: 20, drag: 'line', hint: '끌어서 길 그리기 · 두 손가락으로 이동 · 물 위는 다리(₩60)' },
  { id: 'R', ic: '🏠', name: '주거', cost: 40, drag: 'rect', hint: '끌어서 구역 지정 · 도로에서 2칸 안에 있어야 발전해요' },
  { id: 'C', ic: '🏬', name: '상업', cost: 60, drag: 'rect', hint: '끌어서 구역 지정 · 주민이 가까이 살아야 장사가 돼요' },
  { id: 'I', ic: '🏭', name: '공업', cost: 60, drag: 'rect', hint: '끌어서 구역 지정 · 공해가 나니 집에서 떨어뜨리세요' },
  { sep: true },
  { id: 'power', ic: '⚡', name: '발전소', cost: 2500, hint: '탭해서 짓기 (2×2) · 전기는 도로·건물을 따라 흘러요 · 공급 200' },
  { id: 'water', ic: '💧', name: '급수탑', cost: 600, hint: '탭해서 짓기 · 반경 8칸에 물 공급 · 전기 필요' },
  { id: 'park', ic: '🌳', name: '공원', cost: 120, drag: 'rect', hint: '끌어서 만들기 · 땅값↑ 공해↓ 주민 행복↑' },
  { id: 'police', ic: '🚓', name: '경찰서', cost: 900, hint: '탭해서 짓기 · 반경 9칸 치안 · 도로와 전기 필요' },
  { id: 'fire', ic: '🚒', name: '소방서', cost: 900, hint: '탭해서 짓기 · 반경 9칸 화재 예방·진압' },
  { id: 'school', ic: '🏫', name: '학교', cost: 1200, hint: '탭해서 짓기 (2×2) · 교육 → 상업·공업 3단계 발전' },
  { id: 'hospital', ic: '🏥', name: '병원', cost: 1800, hint: '탭해서 짓기 (2×2) · 건강 → 행복도·땅값↑' },
  { sep: true },
  { id: 'tree', ic: '🌲', name: '나무', cost: 15, drag: 'rect', hint: '끌어서 심기 · 공해를 조금 흡수해요' },
  { id: 'bull', ic: '🚜', name: '철거', cost: 10, drag: 'rect', hint: '끌어서 철거 · 건물·도로·나무·잔해 제거' },
];
const TOOL = {}; TOOLS.forEach(t => { if (t.id) TOOL[t.id] = t; });
const MILESTONES = [[100, '마을', 1000], [500, '큰 마을', 2000], [1500, '소도시', 4000], [4000, '도시', 8000], [10000, '대도시', 15000], [25000, '메트로폴리스', 30000]];
const QUEST = [
  { t: '도로를 5칸 이상 놓으세요', h: '🛣️ 도로 도구를 고르고 화면을 끌어 길을 그려요. 건물은 도로에서 2칸 안에 있어야 해요.', ok: s => s.roads >= 5 },
  { t: '발전소를 지으세요', h: '⚡ 전기는 도로와 건물을 따라 흐릅니다. 발전소를 도로에 붙이되, 공해가 나니 집에서는 떨어뜨리세요.', ok: s => s.cnt.power >= 1 },
  { t: '급수탑을 지으세요', h: '💧 급수탑은 반경 8칸에 물을 공급해요. 전기가 닿아야 작동합니다.', ok: s => s.cnt.water >= 1 },
  { t: '주거지역을 6칸 이상 지정하세요', h: '🏠 도로 옆 빈 땅을 끌어서 주거지역으로 지정하면 집이 들어서요.', ok: s => s.zone.R >= 6 },
  { t: '상업·공업지역을 각각 3칸 이상 지정하세요', h: '🏬 상업과 🏭 공업은 일자리를 만들어요. 공장은 공해를 내니 집에서 떨어뜨리세요.', ok: s => s.zone.C >= 3 && s.zone.I >= 3 },
  { t: '인구 100명을 달성하세요', h: '📊 위쪽 R·C·I 막대는 수요예요. 막대가 위로 차오른 구역을 더 지정하세요. 시간을 ▶▶로 빠르게 해 보세요.', ok: s => s.pop >= 100 },
];

// ---------- state ----------
let tiles, money, month, tax, speed = 1, cam, questStep, milestoneIdx, bailouts, soundOn = true, seed;
let lastIncome = 0, lastExpense = 0, happiness = 70;
let curTool = TOOL.hand, hover = null, paint = null, gest = null, dirty = true, acc = 0;
const ptr = new Map();
const cov = {}; ['police', 'fire', 'school', 'hospital', 'park', 'pol', 'lv', 'crime', 'popc', 'abs'].forEach(k => cov[k] = new Float32Array(N));
const stats = { pop: 0, cJobs: 0, iJobs: 0, dem: { R: 0, C: 0, I: 0 }, roads: 0, cnt: {}, zone: { R: 0, C: 0, I: 0 }, powerUse: 0, powerSupply: 0, unemp: 0, waterPct: 0, items: [], covPct: {} };
const newTile = () => ({ g: 0, k: '', l: 0, ax: -1, ay: -1, pw: false, wt: false, rd: false, fire: 0, d: 0 });

try { soundOn = localStorage.getItem('city-sound') !== '0'; } catch (e) {}

// ---------- audio ----------
let ac = null;
function beep(f, d, type = 'sine', g = 0.12, delay = 0) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.value = f;
    gn.gain.setValueAtTime(g, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(gn).connect(ac.destination); o.start(t0); o.stop(t0 + d);
  } catch (e) {}
}
const SFX = {
  place: () => beep(520, 0.08, 'triangle'),
  road: () => beep(380, 0.06, 'triangle', 0.08),
  demolish: () => beep(140, 0.16, 'sawtooth', 0.1),
  error: () => beep(110, 0.2, 'square', 0.08),
  coin: () => { beep(880, 0.1, 'sine', 0.1); beep(1320, 0.18, 'sine', 0.1, 0.09); },
  alarm: () => { beep(700, 0.12, 'square', 0.06); beep(520, 0.12, 'square', 0.06, 0.14); },
  tap: () => beep(900, 0.04, 'sine', 0.05),
};

// ---------- map generation ----------
function genMap(sd) {
  const rnd = mulberry32(sd);
  tiles = new Array(N); for (let i = 0; i < N; i++) tiles[i] = newTile();
  const G = 6, gw = Math.ceil(W / G) + 2, gh = Math.ceil(H / G) + 2, grid = [];
  for (let i = 0; i < gw * gh; i++) grid.push(rnd());
  const sm = t => t * t * (3 - 2 * t);
  const noise = (x, y) => {

    const t = tiles[idx(x, y)]; if (t.g === 1) continue;
    let w = false; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (inb(x + dx, y + dy) && tiles[idx(x + dx, y + dy)].g === 1) w = true;
    if (w) t.g = 3;

function newGame() {
  seed = (Math.random() * 1e9) >>> 0;
  const start = genMap(seed);
  money = 15000; month = 0; tax = 9; speed = 1; questStep = 0; milestoneIdx = 0; bailouts = 0;
  lastIncome = 0; lastExpense = 0; happiness = 70; acc = 0;
  cam = { x: start.x, y: start.y, z: clamp(Math.min(cw, 480) / (T * 13), 0.6, 1.4) };

// ---------- save / load ----------
function save() {
  try {
    const d = { v: 1, seed, money, month, tax, speed, questStep, milestoneIdx, bailouts, happiness, lastIncome, lastExpense, cam, g: [], k: [], l: [], ax: [], ay: [], f: [] };
    for (const t of tiles) { d.g.push(t.g); d.k.push(t.k); d.l.push(t.l); d.ax.push(t.ax); d.ay.push(t.ay); d.f.push(t.fire); }
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));

}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d || d.v !== 1 || !d.k || d.k.length !== N) return false;
    tiles = new Array(N);
    for (let i = 0; i < N; i++) { const t = newTile(); t.g = d.g[i]; t.k = d.k[i]; t.l = d.l[i]; t.ax = d.ax[i]; t.ay = d.ay[i]; t.fire = d.f[i]; tiles[i] = t; }
    ({ seed, money, month, tax, questStep, milestoneIdx, bailouts } = d);
    happiness = d.happiness ?? 70; lastIncome = d.lastIncome || 0; lastExpense = d.lastExpense || 0;
    speed = d.speed || 1; cam = d.cam || { x: W * T / 2, y: H * T / 2, z: 1 };
    cam.z = clamp(cam.z, ZMIN, ZMAX);
    setTool('hand'); hideInfo(); dirty = true; simStatic(); computeStats(); updateHUD(); renderQuest();
    if (questStep >= QUEST.length) $('quest').style.display = 'none';

}

// ---------- helpers ----------
const isZone = k => k === 'R' || k === 'C' || k === 'I';

}

}

    case 'R': case 'C': case 'I': if (t.g === 2) t.g = 0; t.k = tool.id; t.l = 0; break;
    case 'tree': t.g = 2; break;

  if (t.g === 1) return tool.id === 'road' ? '여기엔 지을 수 없어요' : '물 위에는 지을 수 없어요';
  if (t.k === 'rubble') return '잔해를 먼저 철거하세요 🚜';

// ---------- simulation: static (utilities, coverage) ----------

    if (t.k === 'I' && t.l > 0) addCov(cov.pol, x + 0.5, y + 0.5, 3.5 + t.l, 0.3 * t.l);

    let water = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (inb(x + dx, y + dy) && tiles[idx(x + dx, y + dy)].g === 1) water = 1;

// ---------- simulation: stats ----------
function computeStats() {
  let pop = 0, cJobs = 0, iJobs = 0, roads = 0; const cnt = {}, zone = { R: 0, C: 0, I: 0 };
  let watered = 0, rTiles = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = tiles[idx(x, y)];
    if (t.k === 'road') roads++;
    else if (isZone(t.k)) {
      zone[t.k]++;
      if (t.k === 'R') { pop += ZONE.R.pop[t.l]; if (t.l > 0) { rTiles++; if (t.wt) watered++; } }
      else if (t.k === 'C') cJobs += ZONE.C.jobs[t.l]; else iJobs += ZONE.I.jobs[t.l];
    } else if (BLD[t.k] && t.ax === x && t.ay === y) cnt[t.k] = (cnt[t.k] || 0) + 1;
  }
  const workers = pop * 0.55, jobs = cJobs + iJobs, taxP = (tax - 9) / 50;
  stats.pop = pop; stats.cJobs = cJobs; stats.iJobs = iJobs; stats.roads = roads; stats.cnt = cnt; stats.zone = zone;
  stats.dem.R = clamp((jobs - workers) / (workers + 30) + 0.3 - taxP, -1, 1);
  stats.dem.C = clamp((pop / 5 - cJobs) / (cJobs + 25) + 0.05 - taxP, -1, 1);
  stats.dem.I = clamp((pop / 3.5 - iJobs) / (iJobs + 25) + 0.1 - taxP, -1, 1);
  stats.unemp = workers > 0 ? Math.max(0, (workers - jobs) / workers) : 0;
  stats.waterPct = rTiles ? watered / rTiles : 1;
  // budget
  const items = [];
  if (roads) items.push(['🛣️ 도로 ' + roads + '칸', roads * 0.5]);
  for (const k in cnt) if (BLD[k].upkeep) items.push([BLD[k].ic + ' ' + BLD[k].name + ' ' + cnt[k], cnt[k] * BLD[k].upkeep]);
  stats.items = items;
  stats.expense = Math.round(items.reduce((a, b) => a + b[1], 0));
  stats.income = Math.round((pop * 2.2 + cJobs * 3.5 + iJobs * 2.5) * tax / 100);

  const cp = { police: 0, fire: 0, school: 0, hospital: 0, park: 0 }; let sumLv = 0, sumCr = 0, sumPol = 0, sumHos = 0, unpow = 0, wp = 0;
  for (let i = 0; i < N; i++) {
    const t = tiles[i]; if (t.k !== 'R' || t.l === 0) continue;
    const p = ZONE.R.pop[t.l]; wp += p;
    for (const k in cp) if (cov[k][i] > 0.15) cp[k] += p;

  } else happiness = 70;
  stats.happiness = happiness;
}

// ---------- simulation: tick (one month) ----------
function tick() {
  month++;
  if (dirty) simStatic();
  computeStats();
  // growth / decay
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y), t = tiles[i];
    if (!isZone(t.k)) continue;
    const des = desirability(t, i); t.d = des;
    if (t.fire) continue;
    const ok = t.rd && t.pw && t.wt;
    if (!ok) { if (t.l > 0 && Math.random() < 0.2) t.l--; continue; }
    const dem = stats.dem[t.k];
    if (t.l < 3) {
      const need = [0.2, 0.45, 0.6][t.l];
      const eduOk = t.l < 2 || t.k === 'R' || cov.school[i] > 0.25;
      if (dem > 0 && des >= need && eduOk && Math.random() < (0.1 + 0.45 * des * Math.min(dem, 1)) * (t.l === 0 ? 1 : 0.4)) t.l++;
    }
    if (t.l > 0) {
      if (dem < -0.25 && Math.random() < 0.12 * -dem) t.l--;
      else if (des < 0.22 && Math.random() < 0.08) t.l--;
      else if (t.k === 'R' && happiness < 35 && Math.random() < 0.1) t.l--;
    }
  }
  simFire();
  simStatic();
  computeStats();
  // money
  lastIncome = stats.income; lastExpense = stats.expense;
  const before = money;
  money += lastIncome - lastExpense;
  if (before >= 0 && money < 0) { toast('💸 재정이 적자예요! 세율을 올리거나 지출을 줄이세요', 'warn'); SFX.error(); }
  if (money < -5000) {
    bailouts++;
    if (bailouts <= 3) { money = 0; showModal(bailoutHtml()); setSpeed(0); }
    else { showModal(`<h2>🏚️ 파산</h2><p>시의회가 더 이상 지원을 거부했어요. 도시는 해산되었습니다.</p><p>인구 <b>${fmt(stats.pop)}</b>명, ${dateStr()}까지 운영했어요.</p><div class="btns"><button class="btn primary" id="mNew">새 도시 시작</button></div>`); setSpeed(0); }
  }
  checkQuest(); checkMilestones(); updateHUD();
  if (!$('info').classList.contains('hidden') && infoTile) showInfo(infoTile.x, infoTile.y);
}
function bailoutHtml() {
  return `<h2>🏦 구제금융</h2><p>자금이 바닥나 시의회가 <b>₩5,000</b>을 지원했어요. (${bailouts}/3회)</p><p>세율을 올리거나, 유지비가 큰 공공건물을 줄이고, 일자리와 주민을 늘려 세수를 확보하세요.</p><div class="btns"><button class="btn primary" id="mClose">알겠어요</button></div>`;
}
function flammable(t) { return (isZone(t.k) && t.l > 0) || (BLD[t.k] && t.k !== 'rubble' && t.k !== 'park' && t.k !== 'water' && t.k !== 'power') || t.g === 2; }
let fireToastAt = -1e9;
function simFire() {
  const burning = [];
  for (let i = 0; i < N; i++) if (tiles[i].fire > 0) burning.push(i);
  for (const i of burning) {
    const t = tiles[i], x = i % W, y = (i / W) | 0, c = cov.fire[i];
    if (!t.fire) continue; // already burnt out with its building this tick
    t.fire++;
    const dur = c > 0.5 ? 2 : c > 0.2 ? 3 : 6;
    if (t.fire <= dur) {
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        if (!inb(x + dx, y + dy)) continue;
        const n = tiles[idx(x + dx, y + dy)];
        if (n.fire === 0 && flammable(n) && Math.random() < 0.22 * (1 - c)) n.fire = 1;
      }
    } else {
      t.fire = 0;
      if (isZone(t.k)) t.l = 0;
      else if (BLD[t.k]) {
        const ax = t.ax, ay = t.ay, sz = bldSize(t.k);
        removeBuilding(ax, ay);
        for (let dy = 0; dy < sz; dy++) for (let dx = 0; dx < sz; dx++) { const u = tiles[idx(ax + dx, ay + dy)]; u.k = 'rubble'; u.ax = ax + dx; u.ay = ay + dy; }
      } else if (t.g === 2) t.g = 0;
    }
  }
  // new fires
  for (let i = 0; i < N; i++) {
    const t = tiles[i];
    if (t.fire || !flammable(t) || t.g === 2 && t.k === '') continue;
    const p = (t.k === 'I' ? 0.0012 : BLD[t.k] ? 0.0004 : 0.0005) * (1 - 0.85 * cov.fire[i]);
    if (Math.random() < p) {
      t.fire = 1;
      if (month - fireToastAt > 3) {
        fireToastAt = month; SFX.alarm();
        const x = i % W, y = (i / W) | 0;
        toast('🔥 화재 발생! (탭하여 이동)', 'warn', 4000, () => { cam.x = (x + 0.5) * T; cam.y = (y + 0.5) * T; });
      }
    }
  }
}

function checkQuest() {
  if (questStep >= QUEST.length) return;
  let advanced = false;
  while (questStep < QUEST.length && QUEST[questStep].ok(stats)) { questStep++; money += 500; advanced = true; }
  if (advanced) {
    SFX.coin();
    if (questStep >= QUEST.length) { money += 2000; toast('🎉 기본 과정 완료! 보너스 ₩2,500. 이제 도시를 마음껏 키워 보세요', 'good', 5000); setTimeout(() => $('quest').style.display = 'none', 400); }
    else toast('✅ 목표 달성! 보너스 ₩500', 'good');
    renderQuest(); updateHUD();
  }
}
function renderQuest() {
  const q = $('quest');

}

// ---------- toasts ----------
function toast(msg, cls = '', dur = 2600, onTap) {
  const box = $('toasts');
  for (const o of box.children) if (o.textContent === msg) o.remove(); // no duplicate stacking
  const el = document.createElement('div');
  el.className = 'toast ' + cls; el.textContent = msg; box.appendChild(el);
  if (onTap) el.addEventListener('pointerdown', e => { e.stopPropagation(); onTap(); el.remove(); });
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, dur);
}

// ---------- tools / toolbar ----------
function buildToolbar() {
  const bar = $('toolbar'); bar.innerHTML = '';
  for (const t of TOOLS) {
    if (t.sep) { const s = document.createElement('div'); s.className = 'tool sep'; bar.appendChild(s); continue; }
    const b = document.createElement('button'); b.className = 'tool'; b.dataset.id = t.id;
    b.innerHTML = `<span class="ic">${t.ic}</span><span>${t.name}</span><span class="cost">${t.cost ? '₩' + fmt(t.cost) : '&nbsp;'}</span>`;
    b.addEventListener('click', () => { setTool(t.id); SFX.tap(); });

    const p = ((now / 2600) + h01(x, y, 40 + i) + i / 3) % 1;
    const r = s * scale * (0.1 + 0.18 * p);
    cx.fillStyle = `rgba(200,205,210,${(1 - p) * 0.45})`;
    cx.beginPath(); cx.arc(sx + Math.sin(p * 6 + i) * s * 0.08, sy - p * s * 0.7, r, 0, 7); cx.fill();
  }
}
function drawBld(t, x, y, px, py, s, now) {
  const b = BLD[t.k], sz = b.size, S = s * sz;
  if (t.k === 'park') {
    cx.fillStyle = '#5fae4e'; cx.fillRect(px, py, s, s);
    const v = hsh(x, y, 2);
    if (v % 3 === 0) { cx.fillStyle = '#5aa4dc'; cx.beginPath(); cx.ellipse(px + s * 0.5, py + s * 0.6, s * 0.22, s * 0.15, 0, 0, 7); cx.fill(); }
    else { cx.strokeStyle = '#d9c9a3'; cx.lineWidth = Math.max(1, s * 0.08); cx.beginPath(); cx.moveTo(px, py + s * 0.6); cx.quadraticCurveTo(px + s * 0.5, py + s * 0.3, px + s, py + s * 0.6); cx.stroke(); }
    for (let i = 0; i < 3; i++) {
      const tx = px + s * (0.15 + 0.7 * h01(x, y, 50 + i)), ty = py + s * (0.15 + 0.4 * h01(x, y, 60 + i)), r = s * 0.14;
      cx.fillStyle = 'rgba(0,0,0,.18)'; cx.beginPath(); cx.arc(tx + 1, ty + 2, r, 0, 7); cx.fill();
      cx.fillStyle = i % 2 ? '#2f7d32' : '#3b8f3f'; cx.beginPath(); cx.arc(tx, ty, r, 0, 7); cx.fill();
    }
    return;
  }
  if (t.k === 'rubble') {
    cx.fillStyle = '#6e6259'; cx.fillRect(px + s * 0.08, py + s * 0.08, s * 0.84, s * 0.84);
    cx.fillStyle = '#4a4039';
    for (let i = 0; i < 5; i++) cx.fillRect(px + s * (0.1 + 0.7 * h01(x, y, 70 + i)), py + s * (0.1 + 0.7 * h01(x, y, 80 + i)), s * 0.15, s * 0.12);
    return;
  }
  if (t.k === 'water') {
    cx.fillStyle = 'rgba(0,0,0,.2)'; cx.beginPath(); cx.ellipse(px + s * 0.55, py + s * 0.62, s * 0.34, s * 0.3, 0, 0, 7); cx.fill();
    cx.strokeStyle = '#6b7a8a'; cx.lineWidth = Math.max(1, s * 0.05);
    cx.beginPath(); cx.moveTo(px + s * 0.25, py + s * 0.9); cx.lineTo(px + s * 0.35, py + s * 0.5); cx.moveTo(px + s * 0.75, py + s * 0.9); cx.lineTo(px + s * 0.65, py + s * 0.5); cx.stroke();
    cx.fillStyle = '#8fb3d9'; cx.beginPath(); cx.arc(px + s * 0.5, py + s * 0.42, s * 0.3, 0, 7); cx.fill();
    cx.fillStyle = '#b9d4ee'; cx.beginPath(); cx.arc(px + s * 0.5, py + s * 0.42, s * 0.2, 0, 7); cx.fill();
  } else if (t.k === 'power') {
    const r = box(px, py, s, 0.08, 0.5, 1.84, 1.4, 0.5, '#5a5f66', '#43484f');
    cx.fillStyle = '#2f3338'; cx.fillRect(r.X + r.Wd * 0.15, r.Y - 0.5 * s - s * 0.7, s * 0.22, s * 0.8); cx.fillRect(r.X + r.Wd * 0.4, r.Y - 0.5 * s - s * 0.7, s * 0.22, s * 0.8);
    cx.fillStyle = '#c0392b'; cx.fillRect(r.X + r.Wd * 0.15, r.Y - 0.5 * s - s * 0.7, s * 0.22, s * 0.12); cx.fillRect(r.X + r.Wd * 0.4, r.Y - 0.5 * s - s * 0.7, s * 0.22, s * 0.12);
    if (s >= 14) { drawSmoke(r.X + r.Wd * 0.26, r.Y - 0.5 * s - s * 0.7, s, now, x, y, 1); drawSmoke(r.X + r.Wd * 0.51, r.Y - 0.5 * s - s * 0.7, s, now, x + 7, y, 1); }
    windows(r, 4, 1, s, '#ffd27f', true, x, y);
  } else {
    const style = { police: ['#4a6fa5', '#36507a'], fire: ['#c0392b', '#8e2a1f'], school: ['#d4a24c', '#a67b2e'], hospital: ['#f3f3f3', '#cfd6dd'] }[t.k];
    const r = box(px, py, s, 0.1, 0.45 * sz, 0.8 * sz, 0.45 * sz, 0.4 * sz, style[0], style[1]);
    windows(r, 2 * sz, sz, s, '#dff1ff', false);
    if (t.k === 'hospital' && s >= 10) { cx.fillStyle = '#e53935'; cx.fillRect(r.X + r.Wd / 2 - s * 0.1, r.Y - 0.9 * s + s * 0.25, s * 0.2, s * 0.6); cx.fillRect(r.X + r.Wd / 2 - s * 0.3, r.Y - 0.9 * s + s * 0.45, s * 0.6, s * 0.2); }
    if (t.k === 'school' && s >= 10) { cx.fillStyle = '#fff'; cx.fillRect(r.X + r.Wd / 2 - s * 0.02, r.Y - 0.8 * s - s * 0.3, s * 0.04, s * 0.45); cx.fillStyle = '#e74c3c'; cx.fillRect(r.X + r.Wd / 2 + s * 0.02, r.Y - 0.8 * s - s * 0.3, s * 0.22, s * 0.14); }
  }
  if (s >= 14 && t.k !== 'hospital' && t.k !== 'school') {
    cx.font = `${Math.round(S * 0.34)}px sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(b.ic, px + S / 2, py + S * (t.k === 'water' ? 0.42 : 0.5));
  }
}
function drawFire(px, py, s, now, x, y) {
  cx.fillStyle = `rgba(255,120,0,${0.25 + 0.15 * Math.sin(now / 90 + x)})`; cx.fillRect(px, py, s, s);
  if (s >= 10) {
    cx.font = `${Math.round(s * 0.75)}px sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('🔥', px + s / 2 + Math.sin(now / 70 + y) * s * 0.04, py + s * 0.45 + Math.sin(now / 110 + x) * s * 0.05);
    drawSmoke(px + s * 0.5, py + s * 0.2, s, now, x, y, 0.8);
  }
}
function drawBadge(bx, by, s, ic, now) {
  const r = Math.max(5, s * 0.18), blink = (Math.floor(now / 600) % 2) === 0;
  cx.fillStyle = blink ? 'rgba(255,255,255,.95)' : 'rgba(255,230,230,.9)'; cx.beginPath(); cx.arc(bx, by, r, 0, 7); cx.fill();
  cx.strokeStyle = '#e74c3c'; cx.lineWidth = 1.5; cx.stroke();
  cx.font = `${Math.round(r * 1.3)}px sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillStyle = '#000';
  cx.fillText(ic, bx, by + r * 0.08);
}

// ---------- main loop ----------
let last = performance.now(), saveAcc = 0;
function frame(now) {
  const dt = Math.min(200, now - last); last = now;
  if (speed > 0 && $('modal').classList.contains('hidden')) {
    acc += dt; const iv = [0, 2500, 1200, 500][speed];
    let n = 0; while (acc >= iv && n < 4) { acc -= iv; tick(); n++; }
    if (acc >= iv) acc = 0;
  }
  saveAcc += dt; if (saveAcc > 10000) { saveAcc = 0; save(); }
  if (dirty) simStatic();
  render(now);
  requestAnimationFrame(frame);
}

// ---------- boot ----------
buildToolbar();
resize();
if (!load()) { newGame(); save(); }
else toast(`👋 다시 오셨군요, 시장님. ${dateStr()} · 인구 ${fmt(stats.pop)}명`, 'good');
requestAnimationFrame(frame);
if (location.search.includes('debug')) window.__city = { get tiles() { return tiles; }, stats, cov, get money() { return money; }, set money(v) { money = v; }, get month() { return month; }, tick, get cam() { return cam; } };
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>한손 비행기</title>
<style>
  :root {
    --bg: #0b1026;
    --ink: #eaf0ff;
    --muted: #8d9bc4;
    --accent: #5ad1ff;
    --danger: #ff5f7a;
    --gold: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .hud .score { font-size: 26px; letter-spacing: 1px; }
  .hud .best { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .hud .lives { font-size: 20px; letter-spacing: 2px; text-align: right; }
  .hud .power { font-size: 12px; color: var(--accent); font-weight: 700; text-align: right; margin-top: 4px; min-height: 16px; }

  #pauseBtn {
    pointer-events: auto; margin: 6px 0 0 auto;
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08); color: var(--ink); font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px);
    touch-action: manipulation;
  }
  #pauseBtn.hidden { display: none; }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 28px; text-align: center; background: rgba(11,16,38,.78); backdrop-filter: blur(4px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 36px; letter-spacing: 1px; }
  .overlay h1 span { color: var(--accent); }
  .overlay .plane { font-size: 64px; line-height: 1; filter: drop-shadow(0 6px 16px rgba(90,209,255,.5)); }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 15px; }
  .overlay .final { font-size: 44px; font-weight: 900; color: var(--gold); }
  .overlay .new { color: var(--gold); font-weight: 800; font-size: 14px; }
  .btn {
    font: inherit; font-weight: 800; font-size: 18px; border: 0; cursor: pointer; color: #06192b;
    background: linear-gradient(180deg, #7fe0ff, #3fbdf5); padding: 16px 44px; border-radius: 999px;
    box-shadow: 0 6px 0 #1d7fb0, 0 12px 30px rgba(63,189,245,.35);
    min-width: 72vw; max-width: 340px; touch-action: manipulation;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #1d7fb0; }
  .tips { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .tips b { color: var(--ink); }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .legend span b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="hud">
  <div>
    <div class="score" id="score">0</div>
    <div class="best" id="best">BEST 0</div>
  </div>
  <div>
    <div class="lives" id="lives">❤️❤️❤️</div>
    <div class="power" id="power"></div>
    <button id="pauseBtn" class="hidden" aria-label="일시정지">II</button>
  </div>
</div>

<div class="overlay" id="start">
  <div class="plane">✈️</div>
  <h1>한손 <span>비행기</span></h1>
  <p>엄지손가락 하나로 플레이하는 세로 슈팅 게임</p>
  <div class="tips">
    <div><b>화면 아무 곳</b>이나 누른 채로 움직이면 비행기가 따라옵니다</div>
    <div>총알은 <b>자동 발사</b> · 손가락을 떼면 잠시 멈춰요</div>
  </div>
  <div class="legend">
    <span><b style="background:#5ad1ff"></b>더블샷</span>
    <span><b style="background:#8affc1"></b>보호막</span>
    <span><b style="background:#ffd166"></b>폭탄</span>
    <span><b style="background:#ff8fab"></b>생명</span>
  </div>
  <button class="btn" id="startBtn">출발!</button>
</div>

<div class="overlay hidden" id="over">
  <div class="plane">💥</div>
  <h1>게임 오버</h1>
  <div class="final" id="finalScore">0</div>
  <div class="new hidden" id="newBest">🎉 최고 기록 갱신!</div>
  <p id="overStats"></p>
  <button class="btn" id="retryBtn">다시 출발</button>
</div>

<div class="overlay hidden" id="paused">
  <div class="plane">⏸️</div>
  <h1>일시정지</h1>
  <p>화면을 누르면 다시 시작합니다</p>
  <button class="btn" id="resumeBtn">계속하기</button>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const ui = {
    score: $('score'), best: $('best'), lives: $('lives'), power: $('power'),
    start: $('start'), over: $('over'), paused: $('paused'), pauseBtn: $('pauseBtn'),
    finalScore: $('finalScore'), newBest: $('newBest'), overStats: $('overStats'),
  };

  // ---------- 화면 크기 ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 유틸 ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;
  const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const BEST_KEY = 'onehand-plane-best';
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) {}

  // ---------- 효과음 (WebAudio, 파일 없음) ----------
  let audio = null;
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, audio.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    shoot: () => beep(880, 0.06, 'square', 0.03, -300),
    hit: () => beep(220, 0.12, 'sawtooth', 0.06, -150),
    boom: () => beep(120, 0.35, 'sawtooth', 0.12, -90),
    power: () => beep(660, 0.25, 'triangle', 0.08, 500),
    hurt: () => beep(160, 0.4, 'square', 0.1, -120),
  };

  // ---------- 게임 상태 ----------
  const S = {
    running: false, paused: false, over: false,
    t: 0, score: 0, kills: 0, lives: 3, shake: 0, flash: 0,
    player: null, bullets: [], ebullets: [], enemies: [], parts: [], items: [], stars: [],
    spawnTimer: 0, fireTimer: 0, difficulty: 0, bossTimer: 0,
    power: { double: 0, shield: 0 }, bombs: 0, combo: 0, comboTimer: 0,
  };

  function initStars() {
    S.stars = [];
    for (let i = 0; i < 90; i++) S.stars.push({ x: rand(0, W), y: rand(0, H), z: rand(0.3, 1.4), r: rand(0.6, 1.8) });
  }
  initStars();

  function newPlayer() {
    return { x: W / 2, y: H - 140, r: 16, inv: 0, tilt: 0 };
  }

  function reset() {
    S.running = true; S.paused = false; S.over = false;
    S.t = 0; S.score = 0; S.kills = 0; S.lives = 3; S.shake = 0; S.flash = 0;
    S.player = newPlayer();
    S.bullets = []; S.ebullets = []; S.enemies = []; S.parts = []; S.items = [];
    S.spawnTimer = 1; S.fireTimer = 0; S.difficulty = 0; S.bossTimer = 0;
    S.power = { double: 0, shield: 0 }; S.bombs = 0; S.combo = 0; S.comboTimer = 0;
    touch.active = false;
    updateHUD();
    ui.start.classList.add('hidden'); ui.over.classList.add('hidden'); ui.paused.classList.add('hidden');
    ui.pauseBtn.classList.remove('hidden');
  }

  function updateHUD() {
    ui.score.textContent = S.score.toLocaleString();
    ui.best.textContent = 'BEST ' + Math.max(best, S.score).toLocaleString();
    ui.lives.textContent = '❤️'.repeat(Math.max(0, S.lives)) + '🖤'.repeat(Math.max(0, 3 - S.lives));
    const tags = [];
    if (S.power.double > 0) tags.push('더블샷 ' + Math.ceil(S.power.double) + 's');
    if (S.power.shield > 0) tags.push('🛡 보호막');
    if (S.bombs > 0) tags.push('💣×' + S.bombs);
    ui.power.textContent = tags.join(' · ');
  }

  // ---------- 터치: 상대 이동 (손가락이 비행기를 가리지 않게) ----------
  const touch = { active: false, id: null, lastX: 0, lastY: 0, downAt: 0, moved: 0 };
  const SENS = 1.25;
  const stage = document.getElementById('stage');

  function onDown(e) {
    if (!S.running || S.over) return;
    if (S.paused) { resume(); return; }
    const p = e.changedTouches ? e.changedTouches[0] : e;
    if (touch.active) return;
    touch.active = true; touch.id = p.identifier ?? 'mouse';
    touch.lastX = p.clientX; touch.lastY = p.clientY; touch.downAt = performance.now(); touch.moved = 0;
    e.preventDefault();
  }
  function onMove(e) {
    if (!touch.active || !S.running || S.paused) return;
    let p = null;
    if (e.changedTouches) { for (const t of e.changedTouches) if (t.identifier === touch.id) p = t; }
    else p = e;
    if (!p) return;
    const dx = p.clientX - touch.lastX, dy = p.clientY - touch.lastY;
    touch.lastX = p.clientX; touch.lastY = p.clientY;
    touch.moved += Math.abs(dx) + Math.abs(dy);
    const pl = S.player;
    pl.x = clamp(pl.x + dx * SENS, pl.r + 6, W - pl.r - 6);
    pl.y = clamp(pl.y + dy * SENS, 90, H - 60);
    pl.tilt = clamp(dx * 0.08, -0.6, 0.6);
    e.preventDefault();
  }
  function onUp(e) {
    if (!touch.active) return;
    if (e.changedTouches) { let found = false; for (const t of e.changedTouches) if (t.identifier === touch.id) found = true; if (!found) return; }
    touch.active = false;
    // 짧게 두 번 탭 → 폭탄 사용
    const now = performance.now();
    if (touch.moved < 12 && now - touch.downAt < 250) {
      if (now - lastTap < 320) { useBomb(); lastTap = 0; } else lastTap = now;
    }
  }
  let lastTap = 0;
  stage.addEventListener('touchstart', onDown, { passive: false });
  stage.addEventListener('touchmove', onMove, { passive: false });
  stage.addEventListener('touchend', onUp); stage.addEventListener('touchcancel', onUp);
  stage.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  // 키보드 (데스크톱 테스트용)
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' && S.running && !S.paused) useBomb();
    if ((e.key === 'p' || e.key === 'Escape') && S.running) S.paused ? resume() : pause();
  });
  window.addEventListener('keyup', e => keys[e.key] = false);

  // ---------- 일시정지 ----------
  function pause() { if (!S.running || S.over) return; S.paused = true; ui.paused.classList.remove('hidden'); }
  function resume() { S.paused = false; ui.paused.classList.add('hidden'); last = performance.now(); }
  ui.pauseBtn.addEventListener('click', e => { e.stopPropagation(); S.paused ? resume() : pause(); });
  ui.resumeBtn = $('resumeBtn'); ui.resumeBtn.addEventListener('click', resume);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  $('startBtn').addEventListener('click', () => { beep(440, 0.05, 'triangle', 0.01); reset(); });
  $('retryBtn').addEventListener('click', reset);

  // ---------- 적 / 아이템 생성 ----------
  const ENEMY_TYPES = {
    drone: { r: 14, hp: 1, score: 10, color: '#ff8fab', speed: [2.2, 3.2] },
    zig: { r: 15, hp: 2, score: 25, color: '#ffb86b', speed: [1.8, 2.6] },
    tank: { r: 22, hp: 5, score: 60, color: '#c792ea', speed: [1.0, 1.5] },
    boss: { r: 46, hp: 60, score: 800, color: '#ff5f7a', speed: [0.8, 0.8] },
  };

  function spawnEnemy() {
    const d = S.difficulty;
    let type = 'drone';
    const roll = Math.random();
    if (roll < Math.min(0.18, 0.04 + d * 0.015)) type = 'tank';
    else if (roll < Math.min(0.5, 0.15 + d * 0.03)) type = 'zig';
    const T = ENEMY_TYPES[type];
    const x = rand(T.r + 10, W - T.r - 10);
    S.enemies.push({
      type, x, y: -T.r - 10, r: T.r, hp: T.hp + Math.floor(d / 4) * (type === 'tank' ? 1 : 0), maxHp: T.hp,
      vy: rand(T.speed[0], T.speed[1]) * (1 + d * 0.06), vx: type === 'zig' ? (Math.random() < 0.5 ? -2 : 2) : 0,
      phase: rand(0, Math.PI * 2), shootT: rand(1.2, 2.6), color: T.color, score: T.score, flash: 0,
    });
  }

  function spawnBoss() {
    const T = ENEMY_TYPES.boss;
    S.enemies.push({
      type: 'boss', x: W / 2, y: -T.r - 20, r: T.r, hp: T.hp + S.difficulty * 6, maxHp: T.hp + S.difficulty * 6,
      vy: T.speed[0], vx: 1.3, phase: 0, shootT: 1.0, color: T.color, score: T.score, flash: 0, entered: false,
    });
  }

  const ITEM_TYPES = ['double', 'shield', 'bomb', 'life'];
  const ITEM_COLORS = { double: '#5ad1ff', shield: '#8affc1', bomb: '#ffd166', life: '#ff8fab' };
  const ITEM_ICON = { double: '⇈', shield: '◍', bomb: '✸', life: '♥' };
  function dropItem(x, y, force) {
    if (!force && Math.random() > 0.13) return;
    let type = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
    if (type === 'life' && (S.lives >= 3 || Math.random() < 0.5)) type = 'double';
    S.items.push({ x, y, type, vy: 1.4, r: 14, t: 0 });
  }

  function explode(x, y, color, n = 14, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(1, 4.5) * power;
      S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.35, 0.8), max: 0.8, color, r: rand(1.5, 4) * power });
    }
  }

  function useBomb() {
    if (!S.running || S.paused || S.over || S.bombs <= 0) return;
    S.bombs--;
    S.flash = 0.5; S.shake = 14; sfx.boom(); vibrate([40, 30, 60]);
    for (const e of S.enemies) {
      const dmg = e.type === 'boss' ? 15 : 99;
      e.hp -= dmg; e.flash = 0.2;
      if (e.hp <= 0) killEnemy(e);
    }
    S.enemies = S.enemies.filter(e => e.hp > 0);
    for (const b of S.ebullets) explode(b.x, b.y, '#ffd166', 3, 0.6);
    S.ebullets = [];
    updateHUD();
  }

  function killEnemy(e) {
    S.combo++; S.comboTimer = 2;
    const mult = 1 + Math.min(S.combo, 20) * 0.1;
    S.score += Math.round(e.score * mult);
    S.kills++;
    explode(e.x, e.y, e.color, e.type === 'boss' ? 60 : 16, e.type === 'boss' ? 2.2 : 1);
    if (e.type === 'boss') { S.shake = 18; vibrate([60, 40, 80]); dropItem(e.x, e.y, true); dropItem(e.x - 30, e.y, true); }
    else { S.shake = Math.max(S.shake, 4); dropItem(e.x, e.y, false); }
    sfx.boom();
  }

  function hurtPlayer() {
    const pl = S.player;
    if (pl.inv > 0) return;
    if (S.power.shield > 0) { S.power.shield = 0; pl.inv = 1.2; S.shake = 8; sfx.hit(); vibrate(30); explode(pl.x, pl.y, '#8affc1', 20); updateHUD(); return; }
    S.lives--; pl.inv = 2.0; S.shake = 14; S.flash = 0.25; S.combo = 0;
    sfx.hurt(); vibrate([50, 40, 50]);
    explode(pl.x, pl.y, '#5ad1ff', 28, 1.4);
    updateHUD();
    if (S.lives <= 0) gameOver();
  }

  function gameOver() {
    S.over = true; S.running = false; touch.active = false;
    ui.pauseBtn.classList.add('hidden');
    const isNew = S.score > best;
    if (isNew) { best = S.score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    ui.finalScore.textContent = S.score.toLocaleString();
    ui.newBest.classList.toggle('hidden', !isNew);
    ui.overStats.textContent = `격추 ${S.kills}대 · 생존 ${Math.floor(S.t)}초 · 최고 ${best.toLocaleString()}`;
    setTimeout(() => ui.over.classList.remove('hidden'), 700);
    updateHUD();
  }

  // ---------- 업데이트 ----------
  function update(dt) {
    S.t += dt;
    S.difficulty = S.t / 12; // 12초마다 난이도 +1
    const pl = S.player;

    // 키보드 이동
    const kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    const ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
    if (kx || ky) {
      pl.x = clamp(pl.x + kx * 380 * dt, pl.r + 6, W - pl.r - 6);
      pl.y = clamp(pl.y + ky * 380 * dt, 90, H - 60);
      pl.tilt = kx * 0.4;
    }
    pl.tilt *= 0.85;
    if (pl.inv > 0) pl.inv -= dt;
    if (S.power.double > 0) { S.power.double -= dt; if (S.power.double <= 0) updateHUD(); }
    if (S.comboTimer > 0) { S.comboTimer -= dt; if (S.comboTimer <= 0) S.combo = 0; }
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 40);
    if (S.flash > 0) S.flash -= dt;

    // 별 배경
    for (const s of S.stars) { s.y += (60 + s.z * 160) * dt; if (s.y > H + 2) { s.y = -2; s.x = rand(0, W); } }

    // 자동 발사 (손가락을 대고 있거나 키보드 사용 중)
    const firing = touch.active || kx || ky || keys.z;
    S.fireTimer -= dt;
    if (firing && S.fireTimer <= 0) {
      S.fireTimer = S.power.double > 0 ? 0.11 : 0.15;
      if (S.power.double > 0) {
        S.bullets.push({ x: pl.x - 10, y: pl.y - 14, vy: -11, vx: 0 });
        S.bullets.push({ x: pl.x + 10, y: pl.y - 14, vy: -11, vx: 0 });
      } else S.bullets.push({ x: pl.x, y: pl.y - 18, vy: -10, vx: 0 });
      sfx.shoot();
    }

    // 플레이어 총알
    for (const b of S.bullets) { b.y += b.vy; b.x += b.vx; }
    S.bullets = S.bullets.filter(b => b.y > -20);

    // 적 생성
    S.spawnTimer -= dt;
    if (S.spawnTimer <= 0) {
      spawnEnemy();
      S.spawnTimer = Math.max(0.28, 1.1 - S.difficulty * 0.07);
    }
    S.bossTimer += dt;
    if (S.bossTimer > 45 && !S.enemies.some(e => e.type === 'boss')) { S.bossTimer = 0; spawnBoss(); }

    // 적 이동 & 사격
    for (const e of S.enemies) {
      e.phase += dt * 3;
      if (e.flash > 0) e.flash -= dt;
      if (e.type === 'boss') {
        if (e.y < 110) e.y += e.vy; else e.entered = true;
        if (e.entered) { e.x += e.vx; if (e.x < e.r + 10 || e.x > W - e.r - 10) e.vx *= -1; }
        e.shootT -= dt;
        if (e.shootT <= 0 && e.entered) {
          e.shootT = Math.max(0.55, 1.1 - S.difficulty * 0.03);
          const n = 5;
          for (let i = 0; i < n; i++) {
            const a = Math.PI / 2 + (i - (n - 1) / 2) * 0.28;
            S.ebullets.push({ x: e.x, y: e.y + 30, vx: Math.cos(a) * 3.2, vy: Math.sin(a) * 3.2, r: 6 });
          }
          // 조준탄
          const ang = Math.atan2(pl.y - e.y, pl.x - e.x);
          S.ebullets.push({ x: e.x, y: e.y + 30, vx: Math.cos(ang) * 4.2, vy: Math.sin(ang) * 4.2, r: 5 });
        }
      } else {
        e.y += e.vy;
        if (e.type === 'zig') { e.x += e.vx * Math.sin(e.phase) * 1.6; e.x = clamp(e.x, e.r, W - e.r); }
        if (e.type === 'tank') {
          e.shootT -= dt;
          if (e.shootT <= 0 && e.y > 0 && e.y < H * 0.7) {
            e.shootT = rand(1.4, 2.4);
            const ang = Math.atan2(pl.y - e.y, pl.x - e.x);
            S.ebullets.push({ x: e.x, y: e.y + 10, vx: Math.cos(ang) * 3.4, vy: Math.sin(ang) * 3.4, r: 5 });
          }
        }
      }
    }
    S.enemies = S.enemies.filter(e => e.y < H + e.r + 10);

    // 적 총알
    for (const b of S.ebullets) { b.x += b.vx; b.y += b.vy; }
    S.ebullets = S.ebullets.filter(b => b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);

    // 아이템
    for (const it of S.items) { it.y += it.vy; it.t += dt; it.x += Math.sin(it.t * 3) * 0.6; }
    S.items = S.items.filter(it => it.y < H + 20);

    // 충돌: 총알 → 적
    for (const b of S.bullets) {
      for (const e of S.enemies) {
        if (dist2(b.x, b.y, e.x, e.y) < (e.r + 4) ** 2) {
          S.parts.push({ x: b.x, y: b.y, vx: rand(-1, 1), vy: rand(-2, 0), life: 0.2, max: 0.2, color: '#fff', r: 2 });
          b.y = -999; e.hp--; e.flash = 0.08;
          if (e.hp <= 0) killEnemy(e);
          else sfx.hit();
          break;
        }
      }
    }
    S.bullets = S.bullets.filter(b => b.y > -500);
    S.enemies = S.enemies.filter(e => e.hp > 0);

    // 충돌: 적 / 적 총알 → 플레이어
    const hitR = pl.r - 4;
    for (const e of S.enemies) {
      if (dist2(pl.x, pl.y, e.x, e.y) < (e.r + hitR) ** 2) {
        if (e.type !== 'boss') { e.hp = 0; explode(e.x, e.y, e.color, 10); }
        hurtPlayer();
      }
    }
    S.enemies = S.enemies.filter(e => e.hp > 0);
    for (const b of S.ebullets) {
      if (dist2(pl.x, pl.y, b.x, b.y) < (b.r + hitR) ** 2) { b.y = 9999; hurtPlayer(); }
    }
    S.ebullets = S.ebullets.filter(b => b.y < 5000);

    // 충돌: 아이템 → 플레이어
    for (const it of S.items) {
      if (dist2(pl.x, pl.y, it.x, it.y) < (it.r + pl.r + 6) ** 2) {
        sfx.power(); vibrate(20);
        explode(it.x, it.y, ITEM_COLORS[it.type], 12, 0.8);
        it.y = 9999;
        if (it.type === 'double') S.power.double = Math.min(S.power.double + 10, 25);
        else if (it.type === 'shield') S.power.shield = 1;
        else if (it.type === 'bomb') S.bombs = Math.min(S.bombs + 1, 3);
        else if (it.type === 'life') S.lives = Math.min(S.lives + 1, 3);
        S.score += 15;
        updateHUD();
      }
    }
    S.items = S.items.filter(it => it.y < 5000);

    // 파티클
    for (const p of S.parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy = p.vy * 0.96 + 0.08; p.life -= dt; }
    S.parts = S.parts.filter(p => p.life > 0);

    // 점수 HUD 갱신 (매 프레임 텍스트 교체 비용 억제)
    if (S.score !== lastScoreShown) { lastScoreShown = S.score; ui.score.textContent = S.score.toLocaleString(); if (S.score > best) ui.best.textContent = 'BEST ' + S.score.toLocaleString(); }
  }
  let lastScoreShown = -1;

  // ---------- 그리기 ----------
  function drawPlayer(pl) {
    ctx.save();
    ctx.translate(pl.x, pl.y);
    if (pl.inv > 0 && Math.floor(pl.inv * 12) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.scale(1 - Math.abs(pl.tilt) * 0.5, 1);
    // 엔진 불꽃
    const fl = 10 + Math.random() * 10;
    const g = ctx.createLinearGradient(0, 14, 0, 14 + fl);
    g.addColorStop(0, 'rgba(255,220,120,.95)'); g.addColorStop(1, 'rgba(255,90,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-6, 14); ctx.lineTo(6, 14); ctx.lineTo(0, 14 + fl); ctx.closePath(); ctx.fill();
    // 날개
    ctx.fillStyle = '#3fbdf5';
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-26, 12); ctx.lineTo(-22, 16); ctx.lineTo(0, 8); ctx.lineTo(22, 16); ctx.lineTo(26, 12); ctx.closePath(); ctx.fill();
    // 몸체
    ctx.fillStyle = '#eaf6ff';
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.quadraticCurveTo(9, -4, 7, 16); ctx.lineTo(-7, 16); ctx.quadraticCurveTo(-9, -4, 0, -22); ctx.closePath(); ctx.fill();
    // 조종석
    ctx.fillStyle = '#1d7fb0';
    ctx.beginPath(); ctx.ellipse(0, -6, 3.2, 6, 0, 0, Math.PI * 2); ctx.fill();
    // 꼬리
    ctx.fillStyle = '#ff8fab';
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(-9, 18); ctx.lineTo(9, 18); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 보호막
    if (S.power.shield > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(138,255,193,.85)'; ctx.lineWidth = 2.5;
      ctx.shadowColor = '#8affc1'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(pl.x, pl.y, 30 + Math.sin(S.t * 6) * 2, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }

  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y);
    const col = e.flash > 0 ? '#ffffff' : e.color;
    if (e.type === 'boss') {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(-60, -10); ctx.lineTo(-30, -36); ctx.lineTo(30, -36); ctx.lineTo(60, -10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2a0f1a'; ctx.beginPath(); ctx.ellipse(0, -6, 18, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(0, -6, 6, 0, Math.PI * 2); ctx.fill();
      // 체력바
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(-50, -56, 100, 6);
      ctx.fillStyle = '#ff5f7a'; ctx.fillRect(-50, -56, 100 * clamp(e.hp / e.maxHp, 0, 1), 6);
    } else if (e.type === 'tank') {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(-22, 6); ctx.lineTo(-14, -16); ctx.lineTo(14, -16); ctx.lineTo(22, 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2a1a3a'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-16, -24, 32, 3);
      ctx.fillStyle = '#c792ea'; ctx.fillRect(-16, -24, 32 * clamp(e.hp / e.maxHp, 0, 1), 3);
    } else if (e.type === 'zig') {
      ctx.rotate(Math.sin(e.phase) * 0.3);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(-16, -8); ctx.lineTo(0, -2); ctx.lineTo(16, -8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3a2a10'; ctx.beginPath(); ctx.arc(0, 2, 4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(-13, -8); ctx.lineTo(13, -8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3a1020'; ctx.beginPath(); ctx.arc(0, -1, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake) * 0.5, rand(-S.shake, S.shake) * 0.5);
    // 배경
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b1026'); bg.addColorStop(1, '#161c4a');
    ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
    for (const s of S.stars) {
      ctx.globalAlpha = 0.35 + s.z * 0.45; ctx.fillStyle = '#cfe3ff';
      ctx.fillRect(s.x, s.y, s.r, s.r + s.z * 4);
    }
    ctx.globalAlpha = 1;

    // 아이템
    for (const it of S.items) {
      ctx.save(); ctx.translate(it.x, it.y);
      ctx.shadowColor = ITEM_COLORS[it.type]; ctx.shadowBlur = 16;
      ctx.fillStyle = ITEM_COLORS[it.type];
      ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#06192b'; ctx.font = 'bold 15px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ITEM_ICON[it.type], 0, 1);
      ctx.restore();
    }

    // 총알
    ctx.fillStyle = '#9ef1ff'; ctx.shadowColor = '#5ad1ff'; ctx.shadowBlur = 8;
    for (const b of S.bullets) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(b.x - 2.5, b.y - 9, 5, 18, 3) : ctx.rect(b.x - 2.5, b.y - 9, 5, 18); ctx.fill(); }
    ctx.shadowBlur = 0;
    for (const b of S.ebullets) {
      ctx.fillStyle = '#ff7a90'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff1f4'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }

    for (const e of S.enemies) drawEnemy(e);
    if (S.player && !S.over) drawPlayer(S.player);

    // 파티클
    for (const p of S.parts) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 콤보
    if (S.combo >= 3 && S.comboTimer > 0 && !S.over) {
      ctx.globalAlpha = clamp(S.comboTimer, 0, 1);
      ctx.fillStyle = '#ffd166'; ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`${S.combo} COMBO ×${(1 + Math.min(S.combo, 20) * 0.1).toFixed(1)}`, W / 2, 110);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    if (S.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${clamp(S.flash, 0, 0.6)})`; ctx.fillRect(0, 0, W, H); }

    // 이동 안내 (초반 3초)
    if (S.running && S.t < 3 && !touch.active) {
      ctx.globalAlpha = 0.7; ctx.fillStyle = '#eaf0ff'; ctx.font = '600 15px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('화면을 누른 채로 움직여보세요 👆', W / 2, H - 100);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    dt = Math.min(dt, 0.05);
    if (S.running && !S.paused) update(dt);
    else if (!S.running) { for (const s of S.stars) { s.y += (30 + s.z * 60) * dt; if (s.y > H + 2) { s.y = -2; s.x = rand(0, W); } } for (const p of S.parts) { p.x += p.vx; p.y += p.vy; p.life -= dt; } S.parts = S.parts.filter(p => p.life > 0); }
    draw();
    requestAnimationFrame(frame);
  }
  updateHUD();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
